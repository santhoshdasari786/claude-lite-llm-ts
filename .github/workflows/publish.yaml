name: Publish package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without "v" prefix, e.g. "1.0.0")'
        required: true
        type: string
      npmTag:
        description: 'npm distribution tag (e.g. "latest", "beta", "next")'
        required: false
        default: 'latest'
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # required for npm provenance attestations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version '$VERSION' is not valid semver"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@santhoshdasari786'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Set package version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Build
        run: npm run build

      - name: Publish to registry
        run: |
          NPM_TAG="${{ inputs.npmTag || 'latest' }}"
          npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball
        run: npm pack --pack-destination dist-pack

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-pack/*.tgz
          generate_release_notes: true

      - name: Summary
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "### 🚀 Published package" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package**: \`$PKG_NAME@${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Access**: \`public\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **npm**: https://www.npmjs.com/package/$PKG_NAME" >> "$GITHUB_STEP_SUMMARY"
